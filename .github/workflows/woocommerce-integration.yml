name: ADIM WordPress + WooCommerce integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  woocommerce-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test_only
          MYSQL_DATABASE: adim_test
          MYSQL_USER: adim_test
          MYSQL_PASSWORD: adim_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure PHP and WordPress extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, curl, intl, mbstring, zip, dom, gd
          coverage: none
      - name: Install WP CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar --info
      - name: Provision temporary WordPress
        shell: bash
        run: |
          mkdir -p /tmp/adim-wordpress
          php /tmp/wp-cli.phar core download --path=/tmp/adim-wordpress --allow-root
          php /tmp/wp-cli.phar config create --path=/tmp/adim-wordpress --dbname=adim_test --dbuser=adim_test --dbpass=adim_test_only --dbhost=127.0.0.1 --skip-check --allow-root
          php /tmp/wp-cli.phar core install --path=/tmp/adim-wordpress --url=http://127.0.0.1:8888 --title="ADIM CI" --admin_user=ci_admin --admin_password="ci-only-not-production" --admin_email=ci@example.test --skip-email --allow-root
          php /tmp/wp-cli.phar plugin install woocommerce --activate --path=/tmp/adim-wordpress --allow-root
          cp -R wp-content/themes/adim /tmp/adim-wordpress/wp-content/themes/adim
          cp -R wp-content/plugins/adim-operations /tmp/adim-wordpress/wp-content/plugins/adim-operations
          php /tmp/wp-cli.phar theme activate adim --path=/tmp/adim-wordpress --allow-root
          php /tmp/wp-cli.phar plugin activate adim-operations --path=/tmp/adim-wordpress --allow-root
          # The CLI can infer /adim-wordpress from the temporary path.
          # HTTP tests mount WP as the webserver root; align both option URLs.
          php /tmp/wp-cli.phar option update home http://127.0.0.1:8888 --path=/tmp/adim-wordpress --allow-root
          php /tmp/wp-cli.phar option update siteurl http://127.0.0.1:8888 --path=/tmp/adim-wordpress --allow-root
          php /tmp/wp-cli.phar option get home --path=/tmp/adim-wordpress --allow-root
          php /tmp/wp-cli.phar option get siteurl --path=/tmp/adim-wordpress --allow-root
      - name: Execute actual WooCommerce tests
        run: |
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/integration-wordpress.php" --path=/tmp/adim-wordpress --allow-root
      - name: Test WooCommerce size filter and fitting UX
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/catalog-ux.php" --path=/tmp/adim-wordpress --allow-root
      - name: Provision disposable WooCommerce cart/checkout pages
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/checkout-pages-setup.php" --path=/tmp/adim-wordpress --allow-root
      - name: Test closed checkout and Store API order creation guards
        run: php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/checkout-journey.php" --path=/tmp/adim-wordpress --allow-root
      - name: Test storefront and product URLs over HTTP
        run: bash tests/storefront-http.sh
      - name: Install Chromium for real responsive browser tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real mobile and desktop browser smoke
        shell: bash
        run: |
          php -S 127.0.0.1:8888 -t /tmp/adim-wordpress /tmp/adim-router.php > /tmp/adim-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:8888/ > /dev/null; then break; fi
            sleep 1
          done
          checkout_id=$(php /tmp/wp-cli.phar option get woocommerce_checkout_page_id --path=/tmp/adim-wordpress --allow-root)
          ADIM_CI_CHECKOUT_URL="http://127.0.0.1:8888/?page_id=${checkout_id}" node tests/browser-mobile.mjs
      - name: Create synthetic shipping zone and guest product in disposable CI
        env:
          ADIM_CI_FIXTURE: "yes"
        run: |
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/guest-shipping-fixture.php" --path=/tmp/adim-wordpress --allow-root
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/guest-shipping.php" --path=/tmp/adim-wordpress --allow-root
      - name: Test populated guest cart and shipping without any payment gateway
        shell: bash
        run: |
          # Only temporary /tmp/adim-wordpress/wp-config.php is modified here,
          # never tracked PHP, production configuration or deployment secrets.
          php /tmp/wp-cli.phar config set ADIM_ENABLE_SALES true --raw --path=/tmp/adim-wordpress --allow-root
          php -S 127.0.0.1:8888 -t /tmp/adim-wordpress /tmp/adim-router.php > /tmp/adim-guest-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..25}; do
            if curl -sf http://127.0.0.1:8888/ > /dev/null; then break; fi
            sleep 1
          done
          product_id=$(cat /tmp/adim-ci-guest-product-id)
          checkout_id=$(php /tmp/wp-cli.phar option get woocommerce_checkout_page_id --path=/tmp/adim-wordpress --allow-root)
          ADIM_CI_PRODUCT_ID="$product_id" ADIM_CI_CHECKOUT_URL="http://127.0.0.1:8888/?page_id=${checkout_id}" node tests/browser-guest-checkout.mjs
          php /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/guest-no-orders.php" --path=/tmp/adim-wordpress --allow-root
          # Restore fail-closed state even in the disposable CI instance.
          php /tmp/wp-cli.phar config delete ADIM_ENABLE_SALES --path=/tmp/adim-wordpress --allow-root
      - name: Upload browser viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adim-browser-viewport-captures
          path: browser-screenshots/
          if-no-files-found: ignore
