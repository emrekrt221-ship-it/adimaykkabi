name: ADIM code checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: |
          find wp-content -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: JavaScript syntax
        run: |
          find wp-content -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Check forbidden committed configuration
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(wp-config[.]php|[.]env([.]|$)|id_rsa|private[.]key)$'; then
            echo 'Potential secret/configuration committed'
            exit 1
          fi
